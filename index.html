<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lap Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10161c;
    --surface: #182028;
    --surface-2: #1e2731;
    --line: #2a3542;
    --ink: #eef2f5;
    --ink-dim: #9aa7b2;
    --track: #2c8f6e;
    --track-dim: #1f5f4a;
    --time: #4f8fd6;
    --time-dim: #315a86;
    --fixed: #d69a3f;
    --fixed-dim: #8a642a;
    --other: #6c7a86;
    --radius: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ -webkit-text-size-adjust: 100%; }
  body{ margin:0; padding:0; background:var(--bg); }
  .app{
    color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14px; line-height:1.5;
    padding:20px 16px 60px; max-width:640px; margin:0 auto;
  }
  h1,h2,h3{ font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.02em; margin:0; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .hero{ margin-bottom:22px; }
  .hero .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.14em;
    color:var(--track); text-transform:uppercase; margin-bottom:6px;
  }
  .hero h1{ font-size:26px; text-transform:uppercase; }
  .hero p{ color:var(--ink-dim); margin-top:8px; max-width:46ch; font-size:13px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .card h2{ font-size:14px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:12px; color:var(--ink); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .card h2 .sub{ font-family:'Inter',sans-serif; font-weight:400; text-transform:none; letter-spacing:0; color:var(--ink-dim); font-size:11.5px; }

  /* form */
  .form-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .field{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
  .field label{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; }
  select, input{
    background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:10px; font-size:16px; font-family:inherit; width:100%;
  }
  select:focus, input:focus{ outline:2px solid var(--track); outline-offset:1px; }
  .btn{
    background:var(--track); color:#0c1310; border:none; border-radius:6px;
    padding:12px 18px; font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; font-size:13px; cursor:pointer; margin-top:4px; width:100%;
  }
  .btn:hover{ background:#379e7a; }
  .toggle{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:2px; font-size:11px; }
  .toggle button{
    background:none; border:none; color:var(--ink-dim); padding:5px 12px; border-radius:20px;
    font-family:'JetBrains Mono',monospace; letter-spacing:0.03em; text-transform:uppercase; cursor:pointer;
  }
  .toggle button.active{ background:var(--track); color:#0c1310; }

  /* legend */
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .swatch{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  /* chart */
  .chart-wrap{ overflow-x:auto; }
  .chart-svg{ display:block; min-width:100%; }
  .chart-bar rect{ fill:var(--track); }
  .chart-bar.cutback rect{ fill:var(--fixed); }
  .chart-bar text{ fill:var(--ink-dim); font-family:'JetBrains Mono',monospace; }
  .chart-bar .val-label{ fill:var(--ink); font-size:9px; }
  .chart-bar .wk-label{ font-size:9px; }

  /* week list */
  .week{ padding:10px 0; border-bottom:1px solid var(--line); }
  .week:last-child{ border-bottom:none; padding-bottom:0; }
  .week-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:8px; }
  .week-head .idx{ font-family:'JetBrains Mono',monospace; color:var(--ink-dim); font-size:11.5px; }
  .week-head .idx b{ color:var(--ink); }
  .week-head .total{ font-family:'Oswald',sans-serif; font-size:15px; white-space:nowrap; }
  .tag{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:2px 7px; border-radius:20px; margin-left:7px; border:1px solid var(--fixed-dim); color:var(--fixed);
  }
  .lane{ height:18px; background:var(--surface-2); border-radius:5px; overflow:hidden; display:flex; }
  .lane .seg{ height:100%; }
  .seg.long{ background:var(--track); }
  .seg.time{ background:var(--time); }
  .seg.fixed{ background:var(--fixed); }
  .seg.other{ background:var(--other); }

  /* next week */
  .next-week{ border-color:var(--track-dim); background:linear-gradient(180deg, rgba(44,143,110,0.08), var(--surface)); }
  .nw-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px; }
  .nw-item{ background:var(--surface-2); border-radius:8px; padding:10px; text-align:center; }
  .nw-item .val{ font-family:'Oswald',sans-serif; font-size:19px; }
  .nw-item .lbl{ font-size:9.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  /* run list */
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; color:var(--ink-dim); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; padding-bottom:8px; border-bottom:1px solid var(--line); }
  td{ padding:8px 0; border-bottom:1px solid var(--line); }
  td.num{ font-family:'JetBrains Mono',monospace; white-space:nowrap; }
  .type-pill{ font-size:9.5px; text-transform:uppercase; padding:2px 6px; border-radius:20px; letter-spacing:0.04em; white-space:nowrap; }
  .type-pill.long{ background:rgba(44,143,110,0.15); color:var(--track); }
  .type-pill.time{ background:rgba(79,143,214,0.15); color:var(--time); }
  .type-pill.fixed{ background:rgba(214,154,63,0.15); color:var(--fixed); }
  .type-pill.other{ background:rgba(108,122,134,0.15); color:var(--other); }
  .del{ background:none; border:none; color:var(--ink-dim); cursor:pointer; font-size:18px; padding:0 4px; line-height:1; }
  .del:hover{ color:#dd6b5b; }
  .empty{ color:var(--ink-dim); font-size:13px; padding:12px 0; text-align:center; }
  .storage-note{ font-size:11px; color:var(--ink-dim); text-align:center; margin-top:18px; }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function(){

  const CUTBACK_EVERY = 4;
  const GROWTH_RATE = 0.10;
  const CUTBACK_CUT = 0.75;
  const LONG_PCT_CAP = 0.45;
  const FIXED_CAP_KM = 5;
  const TIME_CAP_MIN = 45;
  const DEFAULT_PACE = 7.5;

  let runs = [];
  let editingPace = DEFAULT_PACE;
  let chartMode = 'distance'; // 'distance' | 'time'

  // ---------- storage (localStorage — persists per browser) ----------
  function loadRuns(){
    try{ runs = JSON.parse(localStorage.getItem('laplog_runs') || '[]'); }
    catch(e){ runs = []; }
    try{ editingPace = parseFloat(localStorage.getItem('laplog_pace')) || DEFAULT_PACE; }
    catch(e){}
    render();
  }
  function saveRuns(){
    try{ localStorage.setItem('laplog_runs', JSON.stringify(runs)); }
    catch(e){ console.error('save failed', e); }
  }
  function savePace(v){
    editingPace = v;
    try{ localStorage.setItem('laplog_pace', String(v)); }catch(e){}
  }

  // ---------- date / week helpers ----------
  function getMonday(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function weekKey(dateStr){ return getMonday(dateStr).toISOString().slice(0,10); }
  function weekLabel(key){
    const d = new Date(key + 'T00:00:00');
    return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
  }
  function kmEquivalent(run){
    if(run.type === 'time'){
      const pace = run.pace || DEFAULT_PACE;
      return run.minutes / pace;
    }
    return run.km;
  }
  function minEquivalent(run){
    if(run.type === 'time') return run.minutes;
    return run.km * editingPace;
  }

  // ---------- weekly aggregation ----------
  function buildWeeks(){
    const map = {};
    runs.forEach(r=>{
      const k = weekKey(r.date);
      if(!map[k]) map[k] = { key:k, runs:[] };
      map[k].runs.push(r);
    });
    const weeks = Object.values(map).sort((a,b)=> a.key.localeCompare(b.key));
    weeks.forEach((w, i)=>{
      w.index = i+1;
      w.long = 0; w.time = 0; w.fixed = 0; w.other = 0;
      w.totalMinutes = 0;
      w.runs.forEach(r=>{
        const km = kmEquivalent(r);
        if(r.type==='long') w.long += km;
        else if(r.type==='time') w.time += km;
        else if(r.type==='fixed') w.fixed += km;
        else w.other += km;
        w.totalMinutes += minEquivalent(r);
      });
      w.total = w.long + w.time + w.fixed + w.other;
      w.isScheduledCutback = w.index % CUTBACK_EVERY === 0;
    });
    return weeks;
  }

  function suggestNextWeek(weeks){
    if(weeks.length === 0){
      return { total:5, long:2, time:12, fixed:1.5, index:1, isCutback:false };
    }
    const last = weeks[weeks.length-1];
    const prevBeforeLast = weeks.length>1 ? weeks[weeks.length-2] : null;
    const nextIndex = last.index + 1;
    const isCutback = nextIndex % CUTBACK_EVERY === 0;

    const basis = (last.isScheduledCutback && prevBeforeLast) ? prevBeforeLast.total : last.total;
    let suggestedTotal = isCutback ? last.total * CUTBACK_CUT : basis * (1+GROWTH_RATE);

    let suggestedFixed = last.fixed > 0 ? Math.min(FIXED_CAP_KM, last.fixed + 0.4) : Math.min(FIXED_CAP_KM, 1.5);
    if(isCutback) suggestedFixed = Math.max(suggestedFixed * 0.85, Math.min(FIXED_CAP_KM, last.fixed || 1.5));

    const timeRuns = last.runs.filter(r=>r.type==='time');
    const lastTimeMin = timeRuns.length ? timeRuns.reduce((s,r)=>s+r.minutes,0)/timeRuns.length : 0;
    let suggestedTimeMin = lastTimeMin > 0 ? Math.min(TIME_CAP_MIN, lastTimeMin + 2) : 15;
    if(isCutback) suggestedTimeMin = Math.max(15, suggestedTimeMin - 4);
    const suggestedTimeKm = suggestedTimeMin / editingPace;

    let suggestedLong = suggestedTotal - suggestedFixed - suggestedTimeKm;
    const cap = suggestedTotal * LONG_PCT_CAP;
    if(suggestedLong > cap) suggestedLong = cap;
    if(suggestedLong < 0) suggestedLong = 0;

    return { total: suggestedTotal, long: suggestedLong, time: suggestedTimeMin, fixed: suggestedFixed, index: nextIndex, isCutback };
  }

  // ---------- chart ----------
  function renderChart(weeks){
    const last12 = weeks.slice(-12);
    if(last12.length === 0){
      return '<div class="empty">Log a few runs to see your trend here.</div>';
    }
    const values = last12.map(w => chartMode === 'distance' ? w.total : w.totalMinutes);
    const maxVal = Math.max(...values, 1);
    const barW = 34, gap = 10, chartH = 110, leftPad = 4;
    const w = last12.length * (barW+gap) + leftPad;
    const bars = last12.map((wk, i)=>{
      const v = chartMode === 'distance' ? wk.total : wk.totalMinutes;
      const h = Math.max(2, (v / maxVal) * chartH);
      const x = leftPad + i*(barW+gap);
      const y = chartH - h;
      const label = chartMode === 'distance' ? v.toFixed(1) : Math.round(v);
      return `
        <g class="chart-bar ${wk.isScheduledCutback ? 'cutback':''}" transform="translate(${x},0)">
          <rect x="0" y="${y}" width="${barW}" height="${h}" rx="3"></rect>
          <text class="val-label" x="${barW/2}" y="${y-5}" text-anchor="middle">${label}</text>
          <text class="wk-label" x="${barW/2}" y="${chartH+14}" text-anchor="middle">${weekLabel(wk.key)}</text>
        </g>`;
    }).join('');
    return `
      <div class="chart-wrap">
        <svg class="chart-svg" viewBox="0 0 ${w} ${chartH+24}" width="${w}" height="${chartH+24}">
          ${bars}
        </svg>
      </div>`;
  }

  // ---------- render ----------
  function render(){
    const weeks = buildWeeks();
    const suggestion = suggestNextWeek(weeks);
    const app = document.getElementById('app');

    app.innerHTML = `
      <div class="hero">
        <div class="eyebrow">Return-to-running · build tracker</div>
        <h1>Lap Log</h1>
        <p>Log each run to see your weekly totals and a simple suggestion for next week's target.</p>
      </div>

      <div class="card">
        <h2>Log a run</h2>
        <form id="run-form">
          <div class="form-row">
            <div class="field">
              <label for="f-date">Date</label>
              <input type="date" id="f-date" required>
            </div>
            <div class="field">
              <label for="f-type">Run type</label>
              <select id="f-type">
                <option value="long">Long run</option>
                <option value="time">Time-based run</option>
                <option value="fixed">Fixed run</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-row" id="value-row"></div>
          <button type="submit" class="btn">Log run</button>
        </form>
      </div>

      <div class="card next-week">
        <h2>Suggested next week
          <span class="sub">Week ${suggestion.index}${suggestion.isCutback ? ' — cutback' : ''}</span>
        </h2>
        <div class="nw-grid">
          <div class="nw-item"><div class="val">${suggestion.total.toFixed(1)}<span class="mono" style="font-size:11px;">km</span></div><div class="lbl">Total</div></div>
          <div class="nw-item"><div class="val">${suggestion.long.toFixed(1)}<span class="mono" style="font-size:11px;">km</span></div><div class="lbl">Long run</div></div>
          <div class="nw-item"><div class="val">${suggestion.fixed.toFixed(1)}<span class="mono" style="font-size:11px;">km</span></div><div class="lbl">Fixed run</div></div>
          <div class="nw-item"><div class="val">${suggestion.time.toFixed(0)}<span class="mono" style="font-size:11px;">min</span></div><div class="lbl">Time run</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Last 12 weeks
          <span class="toggle" id="chart-toggle">
            <button data-mode="distance" class="${chartMode==='distance'?'active':''}">Distance</button>
            <button data-mode="time" class="${chartMode==='time'?'active':''}">Time</button>
          </span>
        </h2>
        ${renderChart(weeks)}
      </div>

      <div class="card">
        <h2>Weekly log</h2>
        <div class="legend">
          <span><span class="swatch" style="background:var(--track)"></span>Long</span>
          <span><span class="swatch" style="background:var(--time)"></span>Time-based</span>
          <span><span class="swatch" style="background:var(--fixed)"></span>Fixed</span>
          <span><span class="swatch" style="background:var(--other)"></span>Other</span>
        </div>
        ${weeks.length === 0 ? '<div class="empty">No runs logged yet. Add your first run above.</div>' :
          [...weeks].reverse().map(w => renderWeek(w)).join('')}
      </div>

      <div class="card">
        <h2>All runs</h2>
        ${runs.length === 0 ? '<div class="empty">Nothing logged yet.</div>' : `
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th></th></tr></thead>
          <tbody>
            ${[...runs].sort((a,b)=> b.date.localeCompare(a.date)).map(r => `
              <tr>
                <td class="mono">${r.date}</td>
                <td><span class="type-pill ${r.type}">${typeLabel(r.type)}</span></td>
                <td class="num">${r.type==='time' ? r.minutes+' min' : r.km+' km'}</td>
                <td style="text-align:right;"><button class="del" data-id="${r.id}" title="Delete">×</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>`}
      </div>

      <div class="storage-note">Saved in this browser only — clearing site data will erase your log.</div>
    `;

    document.getElementById('f-date').valueAsDate = new Date();
    document.getElementById('f-type').addEventListener('change', onTypeChange);
    onTypeChange();
    document.getElementById('run-form').addEventListener('submit', onSubmit);
    document.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteRun(btn.getAttribute('data-id')));
    });
    document.getElementById('chart-toggle').addEventListener('click', (e)=>{
      const btn = e.target.closest('button');
      if(!btn) return;
      chartMode = btn.getAttribute('data-mode');
      render();
    });
  }

  function typeLabel(t){
    return { long:'Long', time:'Time-based', fixed:'Fixed', other:'Other' }[t] || t;
  }

  function renderWeek(w){
    const segs = [
      {cls:'long', v:w.long}, {cls:'time', v:w.time}, {cls:'fixed', v:w.fixed}, {cls:'other', v:w.other}
    ];
    const total = w.total || 1;
    const laneHtml = segs.map(s => s.v>0 ? `<div class="seg ${s.cls}" style="width:${(s.v/total*100).toFixed(1)}%"></div>` : '').join('');
    return `
      <div class="week">
        <div class="week-head">
          <div class="idx">WEEK <b>${w.index}</b> · ${weekLabel(w.key)}${w.isScheduledCutback ? '<span class="tag">Cutback</span>' : ''}</div>
          <div class="total mono">${w.total.toFixed(1)} km</div>
        </div>
        <div class="lane">${laneHtml}</div>
      </div>
    `;
  }

  function onTypeChange(){
    const type = document.getElementById('f-type').value;
    const row = document.getElementById('value-row');
    if(type === 'time'){
      row.innerHTML = `
        <div class="field">
          <label for="f-min">Duration (min)</label>
          <input type="number" id="f-min" min="0" step="1" placeholder="e.g. 25">
        </div>
        <div class="field">
          <label for="f-pace">Pace (min/km)</label>
          <input type="number" id="f-pace" min="3" step="0.1" value="${editingPace}">
        </div>
      `;
    } else {
      row.innerHTML = `
        <div class="field">
          <label for="f-km">Distance (km)</label>
          <input type="number" id="f-km" min="0" step="0.1" placeholder="e.g. 3.5">
        </div>
      `;
    }
  }

  function onSubmit(e){
    e.preventDefault();
    const date = document.getElementById('f-date').value;
    const type = document.getElementById('f-type').value;
    if(!date) return;

    let run = { id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), date, type };

    if(type === 'time'){
      const minutes = parseFloat(document.getElementById('f-min').value);
      const pace = parseFloat(document.getElementById('f-pace').value) || DEFAULT_PACE;
      if(!minutes || minutes<=0) return;
      run.minutes = minutes;
      run.pace = pace;
      savePace(pace);
    } else {
      const km = parseFloat(document.getElementById('f-km').value);
      if(!km || km<=0) return;
      run.km = km;
    }

    runs.push(run);
    saveRuns();
    render();
  }

  function deleteRun(id){
    runs = runs.filter(r => r.id !== id);
    saveRuns();
    render();
  }

  loadRuns();
})();
</script>
</body>
</html>
